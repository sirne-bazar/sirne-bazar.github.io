--body:Figtree,system-ui,sans-serif;--head:'Bowlby One',Impact,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html[dir="rtl"]{--body:'Noto Sans Arabic',Tahoma,system-ui,sans-serif;--head:'Noto Sans Arabic',Tahoma,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--red);color:var(--on-red);padding:18px 20px 22px;border-bottom:6px solid var(--gold)}
.wrap{max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:400 clamp(32px,7vw,54px)/1.1 var(--head);margin:0}
html[dir="rtl"] h1{font-weight:800}
header p{margin:6px 0 14px;font-size:18px}
.lang{display:flex;gap:6px}
.lang button{background:transparent;border:2px solid var(--on-red);color:var(--on-red);border-radius:999px;padding:4px 12px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--on-red);color:var(--red)}
#q{width:100%;border:0;border-radius:12px;padding:12px 16px;background:#fff;color:#241533}
.bar{display:flex;gap:8px;overflow-x:auto;padding:16px 20px;max-width:1000px;margin:0 auto}
.chip{flex:none;border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 16px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 20px 120px;max-width:1000px;margin:0 auto}
.card{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0}
.art{height:130px;display:grid;place-items:center;font-size:64px}
.info{padding:10px 12px 12px}
.info b{display:block}
.price{font-weight:700;margin-top:4px}
.price s{color:var(--muted);font-weight:400;margin-inline-start:6px;font-size:14px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:var(--on-red);border-radius:8px;padding:0 8px;font-size:13px;font-weight:700}
.empty{grid-column:1/-1;color:var(--muted);padding:20px 0}
.cart-btn{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#241533;border:2px solid #241533;border-radius:999px;padding:12px 20px;font-weight:700;z-index:5}
.sheet{position:fixed;inset:0;background:rgba(20,8,32,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{font:400 24px var(--head);margin:14px 0 4px}
.account-box{border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px 0;background:var(--card)}
.account-box h3{margin:0 0 10px;font-size:18px}
.account-box .field{margin-top:12px}
.account-actions{display:grid;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.logout-note{color:var(--muted);font-size:14px;line-height:1.5;margin:0}
#logout{margin-top:4px;border-color:#a52a2a;color:#8b1e1e}
.deal>.primary,.deal>.ghost{margin-top:12px}
.af{gap:14px}

.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.size{min-width:52px;border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600}
.size[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.primary{width:100%;background:var(--red);color:var(--on-red);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:0;text-decoration:underline;color:var(--muted);padding:8px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .e{font-size:32px}
.row div{flex:1}
.qty button{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:16px 0}
.note{font-size:13px;color:var(--muted)}
.open{border:0;background:none;padding:0;text-align:start;display:flex;flex-direction:column;width:100%}
.heart{position:absolute;top:6px;inset-inline-end:6px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#b3203a;font-size:22px;line-height:1}
.row .open{flex:1}.row .heart{position:static;flex:none;border:2px solid var(--line)}
.acct{background:transparent;border:2px solid var(--on-red);color:var(--on-red);border-radius:999px;padding:4px 14px;font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.field{display:block;margin:12px 0;font-weight:600}
.field input{display:block;width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--card);margin-top:4px;font-weight:400}
.deal{border:2px solid var(--ink);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.deal small{color:var(--muted);display:block;margin-bottom:6px}
.badge{display:inline-block;background:var(--gold);color:#241533;border-radius:8px;padding:0 8px;font-weight:700;font-size:13px}
#adminView{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#adminView[hidden]{display:none}
#adminView .wrap{max-width:720px}
.field select{display:block;width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:var(--card);margin-top:4px;font-weight:400}
.af{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.af .full{grid-column:1/-1}
@media(max-width:480px){.af{grid-template-columns:1fr}}
.foot{text-align:center;margin-top:-70px;padding-bottom:100px;position:relative}
.map{position:relative;width:100%;aspect-ratio:624/528;background:var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map polygon{fill:var(--card);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.pin{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0}
.pin:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.pin.tn{width:22px;height:22px}
.pin.tn:before{inset:7px;background:var(--muted);border-width:1px}
.pin.tn[aria-pressed="true"]:before{inset:4px;background:var(--gold);border-width:2px}
.chip.sm{padding:2px 12px;font-size:14px}
.pin[aria-pressed="true"]{z-index:2}
.pin[aria-pressed="true"]:before{inset:5px;background:var(--gold);border-color:var(--ink)}
.pin span{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:0 8px;white-space:nowrap;font-size:13px;font-weight:600}
.pin[aria-pressed="true"] span{display:block}
body{background:#0b0b0b}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),var(--bgimg) center top/cover no-repeat}
header{background:rgba(0,0,0,.62);color:#fff;border-bottom:4px solid #ffc400}
.lang button,.acct{border-color:#ffc400;color:#ffc400}
.lang button[aria-pressed="true"]{background:#ffc400;color:#111}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:clamp(48px,11vw,68px);height:auto;flex:none}
.brandrow h1{font-size:clamp(24px,6vw,42px)}
@media(prefers-reduced-motion:no-preference){.panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}

.lang button,.acct{border-color:#17214a;color:#17214a;background:transparent}
.lang button[aria-pressed="true"]{background:#ffc400;border-color:#ffc400;color:#17214a}
.card,.deal{box-shadow:0 2px 8px rgba(23,33,74,.08)}
.sheet{background:rgba(23,33,74,.45)}
#tag{font-size:clamp(24px,7vw,34px);font-weight:800;line-height:1.3;color:#17214a;margin:14px 0 12px;letter-spacing:0}
#tag::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:#ffc400;margin-top:8px}

/* Sirne Bazar product/gallery/dashboard upgrade */
.card .art{height:190px;background:#fff!important;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:contain!important;display:block;background:#fff}
.card .info{position:relative;background:var(--card);padding:12px 14px 14px;min-height:78px}
.card .info b{font-size:17px;line-height:1.25;margin-bottom:6px}
.card .price{font-size:18px}
.product-gallery{position:relative;width:100%;height:360px;overflow-x:auto;overflow-y:hidden;display:flex;scroll-snap-type:x mandatory;border-radius:16px;background:#fff;-webkit-overflow-scrolling:touch}
.product-gallery::-webkit-scrollbar{display:none}
.product-slide{min-width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;background:#fff}
.product-slide img{width:100%;height:100%;object-fit:contain;display:block}
.gallery-dots{display:flex;justify-content:center;gap:7px;margin:10px 0 16px}
.gallery-dot{width:8px;height:8px;border:0;border-radius:50%;padding:0;background:#b9b9b9}
.gallery-dot.active{background:var(--ink);transform:scale(1.2)}
.product-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.product-detail-block{margin:18px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.product-detail-block h3{margin:0 0 8px;font-size:17px}
.product-detail-block p{margin:0;line-height:1.55;white-space:pre-wrap}
.image-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.image-preview-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.field textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:inherit}
.dashboard-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 20px}
.dashboard-nav button{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 10px;text-align:start;font-weight:700;color:var(--ink)}
.dashboard-nav button[aria-pressed="true"]{border:2px solid var(--ink);background:#fff7d8}
@media(max-width:420px){.product-gallery{height:320px}.card .art{height:170px}}


/* Final Sirne Bazar visual corrections */
:root{
  --bg:#F3F4F6;
  --card:#FFFFFF;
  --line:#D9DEE7;
}
body{
  background:#F3F4F6 !important;
  color:var(--ink);
}
body::before{
  background:none !important;
}
header{
  background:#FFFFFF !important;
  color:var(--ink) !important;
  border-bottom:4px solid var(--gold) !important;
}
.lang button,.acct{
  border-color:var(--ink) !important;
  color:var(--ink) !important;
}
.lang button[aria-pressed="true"]{
  background:var(--gold) !important;
  color:var(--ink) !important;
  border-color:var(--gold) !important;
}

/* Product cards: show the complete original photo, never crop it */
.card .art{
  width:100%;
  height:auto !important;
  min-height:0 !important;
  display:block !important;
  background:#FFFFFF !important;
  overflow:visible !important;
}
.card .art img{
  display:block;
  width:100% !important;
  height:auto !important;
  max-height:none !important;
  object-fit:contain !important;
  object-position:center !important;
  background:#FFFFFF;
}
.card .info{
  background:#FFFFFF;
  padding:14px 14px 16px;
}
.card .info b{
  font-size:18px;
  line-height:1.25;
}
.card .price{
  font-size:19px;
  margin-top:7px;
}

/* Product details: full image inside a large swipe gallery */
.product-gallery{
  width:100%;
  height:min(68vh,520px) !important;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  border-radius:18px;
  background:#FFFFFF;
  -webkit-overflow-scrolling:touch;
}
.product-slide{
  min-width:100%;
  height:100%;
  display:grid;
  place-items:center;
  scroll-snap-align:center;
  background:#FFFFFF;
}
.product-slide img{
  width:100% !important;
  height:100% !important;
  object-fit:contain !important;
  object-position:center !important;
  background:#FFFFFF;
}

/* Dashboard shown directly below the shop products */
.home-dashboard{
  max-width:1000px;
  margin:0 auto 120px;
  padding:0 20px;
}
.home-dashboard-card{
  background:#FFFFFF;
  border:2px solid var(--ink);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 24px rgba(23,33,74,.08);
}
.home-dashboard-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.home-dashboard-head h2{
  margin:0;
  font-size:24px;
}
.home-dashboard-head p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}
.home-dashboard-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.home-dashboard-grid button{
  min-height:64px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#F9FAFB;
  color:var(--ink);
  padding:12px;
  text-align:start;
  font-weight:700;
}
.home-dashboard-grid button:active{
  transform:translateY(1px);
}
.home-dashboard-grid .wide{
  grid-column:1/-1;
}
.home-dashboard-signin{
  width:100%;
  border:2px solid var(--ink);
  border-radius:14px;
  background:var(--gold);
  padding:13px 16px;
  font-weight:700;
}
@media(max-width:430px){
  .home-dashboard-grid{grid-template-columns:1fr 1fr}
  .product-gallery{height:min(62vh,440px)!important}
}


/* Dashboard opens only from the account/name button and scrolls normally */
#acctSheet .panel{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* Bottom dashboard navigation — mobile marketplace style */
.bottom-dashboard{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(680px,calc(100% - 18px));
  z-index:80;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:2px;
  padding:9px 7px 8px;
  background:rgba(255,255,255,.97);
  border:1px solid #D9DEE7;
  border-radius:24px;
  box-shadow:0 10px 32px rgba(23,33,74,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.bottom-dashboard button{
  appearance:none;
  border:0;
  background:transparent;
  color:#777;
  min-width:0;
  padding:5px 2px 4px;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font:inherit;
  font-size:10px;
  font-weight:700;
  line-height:1.1;
}
.bottom-dashboard button.active{color:var(--ink)}
.bottom-dashboard .nav-icon{
  width:25px;
  height:25px;
  display:block;
}
.bottom-dashboard button.active .nav-icon{color:var(--gold)}
.bottom-dashboard small{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
body{padding-bottom:100px!important}
.cart-btn{bottom:100px!important}
@media(min-width:700px){
  .bottom-dashboard{bottom:16px}
  .bottom-dashboard button{font-size:11px}
}

/* Full-screen product photo viewer */
.photo-lightbox{
  position:fixed;
  inset:0;
  z-index:140;
  display:none;
  background:rgba(0,0,0,.94);
  color:#fff;
}
.photo-lightbox.open{display:block}
.photo-lightbox-track{
  width:100%;
  height:100%;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.photo-lightbox-track::-webkit-scrollbar{display:none}
.photo-lightbox-slide{
  min-width:100%;
  height:100%;
  scroll-snap-align:center;
  display:grid;
  place-items:center;
  padding:58px 10px 62px;
}
.photo-lightbox-slide img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
}
.photo-lightbox-close{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  right:14px;
  z-index:2;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:28px;
  line-height:1;
}
.photo-lightbox-count{
  position:absolute;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:2;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(0,0,0,.5);
  font-size:13px;
}
.product-slide img{cursor:zoom-in}


/* Compact language controls */
.lang{
  gap:6px !important;
  flex-wrap:wrap;
}
.lang button{
  width:auto !important;
  min-width:0 !important;
  min-height:32px !important;
  padding:5px 10px !important;
  border-width:1.5px !important;
  border-radius:999px !important;
  font-size:13px !important;
  line-height:1 !important;
  font-weight:700 !important;
}
@media(max-width:430px){
  .lang{gap:5px !important}
  .lang button{
    min-height:30px !important;
    padding:4px 9px !important;
    font-size:12px !important;
  }
}

</style>

async function doAuth(){
  var msg=$("acctPanel").querySelector("#emsg"),pw=$("upw").value,idv=parseId($("em").value);
  if(!idv){$("em").focus();msg.textContent=ID_LABEL[L];return}
  if(pw.length<6){msg.textContent=t().pwmin;return}
  if(!supabaseClient){msg.textContent="Supabase is not configured yet.";return}
  try{
    if(authMode==="up"){
      var un=$("un").value.trim(),ph=$("uph").value.trim();
      if(!un){$("un").focus();return}
      if(idv.type==="phone"&&!ph)ph=idv.value;
      if(ph.length<6){$("uph").focus();return}
      if(DL.gid==null){msg.textContent=t().locReq;return}
      if(!$("agree").checked){msg.textContent=t().agreeReq;return}
      var redirectUrl=window.location.origin+window.location.pathname;
      var cred=idv.type==="email"?{email:idv.value,password:pw,options:{data:{name:un,phone:ph},emailRedirectTo:redirectUrl}}:{phone:idv.value,password:pw,options:{data:{name:un,phone:ph}}};
      var sr=await supabaseClient.auth.signUp(cred);
      if(sr.error){msg.textContent=sr.error.message;return}
      if(sr.data.user&&sr.data.session){await finishLogin(sr.data.user,un);return}
      if(idv.type==="phone"){pendingOtp=idv.value;AD.un=un;AD.uph=ph;drawAcct();return}
      msg.innerHTML="Account created. Please confirm your email before signing in.<br><button class='ghost' id='resendConfirm' type='button'>Resend confirmation email</button>";return;
    }else{
      var lr=await supabaseClient.auth.signInWithPassword(idv.type==="email"?{email:idv.value,password:pw}:{phone:idv.value,password:pw});
      if(lr.error){var lm=String(lr.error.message||"");if(/invalid login credentials/i.test(lm)&&idv.type==="email"){msg.innerHTML="Login failed. Check the password and make sure your email is confirmed.<br><button class='ghost' id='resendConfirm' type='button'>Resend confirmation email</button>"}else{msg.textContent=lm}return}
      var u=lr.data.user;
      await finishLogin(u,idv.type==="email"?idv.value.split("@")[0]:idv.value);
    }
  }catch(err){console.error(err);msg.textContent=err.message||"Authentication failed."}
}

async function finishSupabaseAuth(){
  if(!supabaseClient) return;
  try{
    var u=new URL(window.location.href);
    var code=u.searchParams.get("code");
    var err=u.searchParams.get("error_description")||u.searchParams.get("error");
    if(err){
      console.warn("Supabase auth redirect error:",err);
      history.replaceState({},document.title,u.origin+u.pathname+u.search.replace(/(?:^|&)error(?:_description)?=[^&]*/g,"").replace(/^&/,""));
      return;
    }
    var ss=await supabaseClient.auth.getSession();
    if(!ss.data.session && code){
      var ex=await supabaseClient.auth.exchangeCodeForSession(code);
      if(ex.error) throw ex.error;
    }
    if(code || window.location.hash){
      history.replaceState({},document.title,u.origin+u.pathname);
    }
  }catch(err){
    console.error("Supabase email confirmation callback failed:",err);
  }
}
async function resendConfirmation(){
  var msg=$("acctPanel")&&$("acctPanel").querySelector("#emsg");
  var em=$("em")?$("em").value.trim().toLowerCase():"";
  if(!supabaseClient||!em||em.indexOf("@")<1){if(msg)msg.textContent="Enter your email address first.";return}
  try{
    var redirectUrl=window.location.origin+window.location.pathname;
    var r=await supabaseClient.auth.resend({type:"signup",email:em,options:{emailRedirectTo:redirectUrl}});
    if(r.error){if(msg)msg.textContent=r.error.message;return}
    if(msg)msg.textContent="Confirmation email sent again. Check your inbox (and Spam/Junk).";
  }catch(err){if(msg)msg.textContent=err.message||"Could not resend the confirmation email."}
}

  var c=$("photoLightboxCount");
  if(c)c.textContent=imgs.length?((lightboxIndex+1)+" / "+imgs.length):"";
}
function openPhotoLightbox(startIndex){
  if(!pick)return;
  var imgs=productImages(pick);if(!imgs.length)return;
  lightboxIndex=Math.max(0,Math.min(startIndex||0,imgs.length-1));
  var tr=$("photoLightboxTrack");
  tr.innerHTML=imgs.map(function(im,i){return '<div class="photo-lightbox-slide"><img src="'+im+'" alt="'+esc(nm(pick))+' full photo '+(i+1)+'"></div>'}).join("");
  $("photoLightbox").classList.add("open");
  $("photoLightbox").setAttribute("aria-hidden","false");
  requestAnimationFrame(function(){tr.scrollLeft=lightboxIndex*tr.clientWidth;updateLightboxCount()});
}
function closePhotoLightbox(){
  $("photoLightbox").classList.remove("open");
  $("photoLightbox").setAttribute("aria-hidden","true");
}
